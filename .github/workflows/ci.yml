name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Biome Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check backend
        run: pnpm --filter backend exec biome ci .

      - name: Check frontend
        run: pnpm --filter frontend exec biome ci .

  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests for ${{ matrix.project }}
        run: pnpm --filter ${{ matrix.project }} test

  compile:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for build
        if: matrix.project == 'frontend'
        run: echo "VITE_API_URL=http://localhost:3000" > frontend/.env

      - name: Build ${{ matrix.project }}
        run: pnpm --filter ${{ matrix.project }} build

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ghcr.io/kretostan/chat-app/${{ github.ref_name }}-latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.frontend
          build-args: VITE_API_URL=http://backend:3000
          push: true
          tags: ghcr.io/kretostan/chat-app/${{ github.ref_name }}-latest

  docker-up:
    if: github.event_name == 'push'
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [compile, build-and-push]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Test container startup
        env:
          CI_REF: ${{ github.ref_name }}
        run: |
          docker compose -p chat-app -f compose.ci.yaml pull
          docker compose -p chat-app -f compose.ci.yaml up -d
          sleep 5
          docker compose ps
          curl --fail http://localhost:3000/health || exit 1

      - name: Clean up
        if: always()
        run: docker compose -p chat-app -f compose.ci.yaml down
