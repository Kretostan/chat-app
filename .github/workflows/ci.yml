name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Biome Check
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check backend
        run: pnpm --filter backend exec biome ci .

      - name: Check frontend
        run: pnpm --filter frontend exec biome ci .

  test:
    name: Test ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests for ${{ matrix.project }}
        run: pnpm --filter ${{ matrix.project }} test

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    needs: [lint, test]
    strategy:
      matrix:
        project: [backend, frontend]

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create .env for build
        if: matrix.project == 'frontend'
        run: echo "VITE_API_URL=http://localhost:3001" > frontend/.env

      - name: Build ${{ matrix.project }}
        run: pnpm --filter ${{ matrix.project }} build

  docker-check:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout the code
        uses: actions/checkout@v7

      - name: Build images with Docker Compose
        run: docker compose -p chat-app -f compose.yaml build

      - name: Test container startup
        run: |
          docker compose -p chat-app -f compose.yaml up -d
          sleep 5
          docker compose ps
          curl --fail http://localhost:3000/health || exit 1

      - name: Clean up
        if: always()
        run: docker compose -p chat-app -f compose.yaml down
