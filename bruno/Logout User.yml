info:
  name: Logout User
  type: http
  seq: 4

http:
  method: POST
  url: localhost:3001/auth/logout
  body:
    type: text
    data: |-
      {
          "login": "{{email}}",
          "password": "{{password}}"
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
